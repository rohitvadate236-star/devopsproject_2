services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autodrive
      POSTGRES_USER: autodrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodrive -d autodrive"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  autodrive-api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: autodrive
      PGUSER: autodrive
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      autodrive-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
