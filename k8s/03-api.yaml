apiVersion: v1
kind: Service
metadata:
  name: autodrive-api
  namespace: automobile-shop
spec:
  selector:
    app: autodrive-api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodrive-api
  namespace: automobile-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autodrive-api
  template:
    metadata:
      labels:
        app: autodrive-api
    spec:
      containers:
        - name: api
          image: autodrive-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: autodrive-config
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: autodrive-db-secret
                  key: PGPASSWORD
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
