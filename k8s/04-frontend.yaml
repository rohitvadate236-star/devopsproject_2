apiVersion: v1
kind: Service
metadata:
  name: autodrive-frontend
  namespace: automobile-shop
spec:
  selector:
    app: autodrive-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodrive-frontend
  namespace: automobile-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autodrive-frontend
  template:
    metadata:
      labels:
        app: autodrive-frontend
    spec:
      containers:
        - name: frontend
          image: autodrive-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
