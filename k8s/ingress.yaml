apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autodrive
  namespace: automobile-shop
spec:
  rules:
    - host: shop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autodrive-frontend
                port:
                  number: 80
