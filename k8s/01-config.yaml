apiVersion: v1
kind: ConfigMap
metadata:
  name: autodrive-config
  namespace: automobile-shop
data:
  PGHOST: autodrive-db
  PGPORT: "5432"
  PGDATABASE: autodrive
  PGUSER: autodrive
  PORT: "4000"
  NODE_ENV: production
---
apiVersion: v1
kind: Secret
metadata:
  name: autodrive-db-secret
  namespace: automobile-shop
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-this-development-password
  PGPASSWORD: change-this-development-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: autodrive-db-init
  namespace: automobile-shop
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        name TEXT NOT NULL,
        category TEXT NOT NULL,
        description TEXT NOT NULL,
        price_cents INTEGER NOT NULL CHECK (price_cents >= 0),
        stock INTEGER NOT NULL DEFAULT 0 CHECK (stock >= 0),
        image_url TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS orders (
        id SERIAL PRIMARY KEY,
        customer_name TEXT NOT NULL,
        email TEXT NOT NULL,
        phone TEXT NOT NULL,
        shipping_address TEXT NOT NULL,
        total_cents INTEGER NOT NULL CHECK (total_cents >= 0),
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS order_items (
        order_id INTEGER NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
        product_id INTEGER NOT NULL REFERENCES products(id),
        quantity INTEGER NOT NULL CHECK (quantity > 0),
        unit_price_cents INTEGER NOT NULL CHECK (unit_price_cents >= 0),
        PRIMARY KEY (order_id, product_id)
    );
    INSERT INTO products (name, category, description, price_cents, stock, image_url)
    VALUES
      ('Carbon Fiber Steering Wheel', 'Interior', 'A performance-inspired steering wheel with a premium carbon-fiber finish.', 42900, 12, 'https://images.unsplash.com/photo-1489824904134-891ab64532f1?auto=format&fit=crop&w=900&q=85'),
      ('LED Headlight Conversion Kit', 'Lighting', 'Bright, efficient LED headlights for improved visibility on every drive.', 18900, 24, 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=900&q=85'),
      ('All-Weather Floor Mats', 'Interior', 'Durable, easy-clean floor protection made for everyday adventures.', 8900, 35, 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=85'),
      ('Sport Alloy Wheel Set', 'Wheels', 'Lightweight multi-spoke alloys with a refined satin graphite finish.', 89900, 8, 'https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=900&q=85'),
      ('Performance Brake Kit', 'Performance', 'Responsive, confident stopping power for spirited road driving.', 54900, 15, 'https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=900&q=85'),
      ('Premium Roof Rack', 'Accessories', 'A low-profile aluminum rack to carry more on your next getaway.', 32900, 11, 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=900&q=85')
    ON CONFLICT DO NOTHING;
